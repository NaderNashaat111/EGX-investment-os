name: Production smoke checks

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '20 */6 * * *'

permissions:
  contents: read
  issues: write

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait briefly for Vercel production deployment
        if: github.event_name == 'push'
        run: sleep 45

      - name: Verify production page and security headers
        shell: bash
        run: |
          set -euo pipefail
          URL='https://egx-investment-os.vercel.app/'
          BODY="$(mktemp)"
          HEADERS="$(mktemp)"

          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 10 --retry-all-errors \
            --dump-header "$HEADERS" \
            --output "$BODY" \
            "$URL"

          STATUS="$(awk 'toupper($1) ~ /^HTTP\// {code=$2} END {print code}' "$HEADERS")"
          test "$STATUS" = '200'

          grep -Fq '<title>EGX Investment OS</title>' "$BODY"
          grep -Fq 'No broker orders are placed by this application.' "$BODY"
          grep -Fq 'Workspace temporarily unavailable' "$BODY"

          tr -d '\r' < "$HEADERS" > "${HEADERS}.normalized"
          H="${HEADERS}.normalized"

          grep -Eiq '^strict-transport-security: .+' "$H"
          grep -Eiq '^content-security-policy: .*frame-ancestors .none.' "$H"
          grep -Eiq '^x-content-type-options: nosniff$' "$H"
          grep -Eiq '^x-frame-options: DENY$' "$H"
          grep -Eiq '^referrer-policy: strict-origin-when-cross-origin$' "$H"
          grep -Eiq '^cross-origin-opener-policy: same-origin$' "$H"
          grep -Eiq '^cross-origin-resource-policy: same-origin$' "$H"
          grep -Eiq '^x-permitted-cross-domain-policies: none$' "$H"
          grep -Eiq '^permissions-policy: .*camera=\(\).*microphone=\(\).*geolocation=\(\)' "$H"
          grep -Eiq '^cache-control: .*no-store.*max-age=0' "$H"

          echo 'Production page checks passed.'

      - name: Verify Supabase API security boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hpolboqjrchstbsdhwuh.supabase.co/functions/v1'

          expect_status() {
            local expected="$1" method="$2" url="$3" body="${4:-}"
            local output status
            output="$(mktemp)"
            if [ "$method" = 'POST' ]; then
              status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
                --retry 3 --retry-delay 5 --retry-all-errors \
                -X POST -H 'content-type: application/json' --data "$body" "$url")"
            else
              status="$(curl --silent --show-error --output "$output" --write-out '%{http_code}' \
                --retry 3 --retry-delay 5 --retry-all-errors \
                -X "$method" "$url")"
            fi
            if [ "$status" != "$expected" ]; then
              echo "Expected $expected from $url, got $status"
              cat "$output"
              exit 1
            fi
          }

          # User APIs must reject missing user sessions.
          expect_status 401 POST "$BASE/portfolio-state-api" '{}'
          expect_status 401 POST "$BASE/recommendation-workflow-api" '{"action":"feed"}'
          expect_status 401 POST "$BASE/portfolio-onboarding-api" '{"action":"preview","payload":{}}'
          expect_status 401 POST "$BASE/reference-data-api" '{"action":"instruments"}'

          # Internal workers/ingestors use custom backend-key authorization.
          expect_status 401 POST "$BASE/ai-thesis-worker" '{}'
          expect_status 401 POST "$BASE/eodhd-eod-ingest" '{"ticker":"COMI"}'

          # Public auth portal is GET-only and should reject state-changing methods.
          expect_status 405 POST "$BASE/user-auth-portal" '{}'
          expect_status 200 GET "$BASE/user-auth-portal"

          echo 'Supabase security-boundary checks passed.'

      - name: Safety assertion
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            https://egx-investment-os.vercel.app/)"

          if grep -Eiq 'execute real trade|place broker order|live broker execution' <<<"$BODY"; then
            echo 'Unexpected broker-execution language detected.'
            exit 1
          fi

          echo 'No live broker-execution language detected.'

      - name: Open or update smoke incident on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE='Production smoke checks failing'
          ISSUE_NUMBER="$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)"
          BODY="Production smoke checks failed on $(date -u +'%Y-%m-%d %H:%M:%S UTC').\n\nRun: ${RUN_URL}\n\nTreat this as an operational incident until a later smoke run passes. Real-money execution remains disabled by design."

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close resolved smoke incident
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          TITLE='Production smoke checks failing'
          mapfile -t ISSUES < <(gh issue list --state open --search "$TITLE in:title" --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number")
          for ISSUE_NUMBER in "${ISSUES[@]}"; do
            gh issue close "$ISSUE_NUMBER" --comment "Production smoke checks recovered successfully. Passing run: ${RUN_URL}"
          done
