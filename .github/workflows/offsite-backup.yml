name: Off-site database backup

on:
  workflow_dispatch:
  schedule:
    - cron: '20 1 * * *'

permissions:
  contents: read

concurrency:
  group: production-offsite-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_OUTPUT_DIR: ${{ runner.temp }}/egx-backup
      R2_ENDPOINT: https://e53a3b3dd548114a80d8f4162e0e15cc.r2.cloudflarestorage.com
      R2_BUCKET: egx-investment-os-backups
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}" || { echo 'Missing SUPABASE_DB_URL'; exit 1; }
          test -n "${AWS_ACCESS_KEY_ID:-}" || { echo 'Missing R2_ACCESS_KEY_ID'; exit 1; }
          test -n "${AWS_SECRET_ACCESS_KEY:-}" || { echo 'Missing R2_SECRET_ACCESS_KEY'; exit 1; }

      - name: Install Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(curl -fsSL https://api.github.com/repos/supabase/cli/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))")
          curl -fsSL "https://github.com/supabase/cli/releases/download/v${VERSION}/supabase_linux_amd64.tar.gz" -o /tmp/supabase.tar.gz
          tar -xzf /tmp/supabase.tar.gz -C /tmp supabase
          sudo install /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Create guarded logical backup
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./ops/logical-backup.sh
          ./ops/logical-backup.sh

      - name: Upload and verify in Cloudflare R2
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE=$(find "$BACKUP_OUTPUT_DIR" -maxdepth 1 -type f ! -name '*.sha256' | head -n 1)
          test -n "$BUNDLE" || { echo 'Backup bundle not found'; exit 1; }
          CHECKSUM_FILE="${BUNDLE}.sha256"
          test -f "$CHECKSUM_FILE" || { echo 'Bundle checksum not found'; exit 1; }
          KEY="daily/$(date -u +%Y/%m/%d)/$(basename "$BUNDLE")"
          aws s3 cp "$BUNDLE" "s3://${R2_BUCKET}/${KEY}" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 cp "$CHECKSUM_FILE" "s3://${R2_BUCKET}/${KEY}.sha256" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          LOCAL_SHA=$(sha256sum "$BUNDLE" | awk '{print $1}')
          REMOTE_SHA=$(aws s3api head-object --bucket "$R2_BUCKET" --key "$KEY" --endpoint-url "$R2_ENDPOINT" --checksum-mode ENABLED --query 'ChecksumSHA256' --output text 2>/dev/null || true)
          aws s3api head-object --bucket "$R2_BUCKET" --key "$KEY" --endpoint-url "$R2_ENDPOINT" >/dev/null
          echo "Uploaded and remotely verified object presence: $KEY"
          echo "Local SHA-256: $LOCAL_SHA"

      - name: Remove runner backup copy
        if: always()
        shell: bash
        run: rm -rf "${BACKUP_OUTPUT_DIR:-/tmp/egx-backup}"
