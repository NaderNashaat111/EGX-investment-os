ead p{margin:0;color:var(--muted)}.headActions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:1px solid transparent;border-radius:9px;padding:9px 13px;font-weight:750;background:var(--green);color:#fff}.btn:hover{filter:brightness(.96)}.btn.secondary{background:#fff;color:var(--ink);border-color:var(--line)}.btn.danger{background:#fff;color:var(--red);border-color:#ecc8c4}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px}.metric label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:10px}.metric strong{font-size:25px;letter-spacing:-.03em}.metric .sub{margin-top:8px;font-size:12px;color:var(--muted)}.cols{grid-template-columns:minmax(0,1.45fr) minmax(280px,.7fr)}.two{grid-template-columns:1fr 1fr}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.sectionTitle h2{font-size:17px;margin:0}.status{border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:6px}.status.ok{background:var(--green2);color:var(--green)}.status.wait{background:var(--amberbg);color:var(--amber)}.status.bad{background:var(--redbg);color:var(--red)}.status.info{background:var(--blue2);color:var(--blue)}.status.neutral{background:#eef2f1;color:#51615c}.banner{display:flex;gap:13px;align-items:flex-start;padding:15px;border-radius:12px;background:#f8fbfa;border:1px solid var(--line)}.banner.warning{background:var(--amberbg);border-color:#f1dfaf}.banner .icon{font-size:20px;line-height:1}.banner strong{display:block;margin-bottom:4px}.tableWrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:10px 8px;border-botto holdingRow{display:grid;grid-template-columns:1.4fr .7fr .9fr 36px;gap:8px;align-items:end;margin-bottom:9px}.previewGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0}.previewItem{padding:12px;border-radius:10px;background:#f6f9f8}.previewItem span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.previewItem strong{font-size:17px}.modalBack{position:fixed;inset:0;background:rgba(7,24,20,.52);display:grid;place-items:center;padding:20px;z-index:50}.modal{background:#fff;width:min(720px,100%);max-height:88vh;overflow:auto;border-radius:16px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.24)}.modalHead{display:flex;justify-content:space-between;gap:14px;align-items:start}.modalHead h2{margin:0}.x{border:0;background:#eef2f1;width:32px;height:32px;border-radius:8px;font-weight:900}.actionRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.recCard{padding:16px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fff}.recTop{display:flex;align-items:center;justify-content:space-between;gap:12px}.recMeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.recCard p{color:#53635e;line-height:1.5}.skeleton{background:linear-gradient(90deg,#edf2f0,#f7f9f8,#edf2f0);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:7px;height:18px}@keyframes sh{to{background-position:-200% 0}}.toast{position:fixed;right:20px;bottom:20px;background:#0f2721;color:#fff;border-radius:11px;padding:12px 15px;box-shadow:var(--shadow);z-index:80;max-width:380px}.mobileNav{display:none}.disclosure{font-size:12px;line-height:1.5;color:#687873;margin-top:18px}.select{min-width:180px}.timeline{display:grid;gap:10px}.timelineItem{border-left:3px solid #cfe1da;padding:4px 0 4px 14px}.timelineItem b{display:block;margin-bottom:3px}.audit{display:grid;gap:8px}.auditRow{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid #edf1f0}.auditRow:last-child{border:0}.donut{--v:0deg;width:120px;height:120px;border-radius:50%;background:conic-gradient(#438a70 var(--v),#e9efed 0);position:relative;margin:8px auto}.donut:after{content:"";position:absolute;inset:18px;border-radius:50%;background:#fff}.legend{display:grid;gap:8px}.legendRow{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:#438a70}.dot.cash{background:#b9c9c3}.kpiStrip{display:flex;gap:10px;flex-wrap:wrap}.kpiMini{background:#f7faf9;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:150px}.kpiMini span{display:block;font-size:11px;color:var(--muted)}.kpiMini b{font-size:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar .input{width:auto;min-width:180px}.notice{font-size:12px;color:var(--muted);line-height:1.5}

<div id="app"><div class="authPane"><div class="skeleton" style="width:220px;height:28px"></div></div></div>
<div id="modalRoot"></div><div id="toastRoot" aria-live="polite"></div>
<script>
const PROJECT_URL="https://hpolboqjrchstbsdhwuh.supabase.co",KEY="sb_publishable_KxqEX8dBpo55viRKJenUog_cg1r02yC",APP_URL=location.origin+location.pathname;
const STORE='egx_investment_os_session_v2';
const state={session:null,user:null,portfolios:[],selectedPortfolioId:null,recs:[],instruments:[],transactions:[],executions:[],view:'dashboard',loading:false,onboardingPreview:null,onboardingHoldings:[],onboardingName:'My EGX Portfolio',onboardingCash:'100000',addingPortfolio:false,historyFilter:'all',workspaceError:null,hasLoadedWorkspace:false};
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=(n,c='EGP')=>new Intl.NumberFormat('en-EG',{style:'currency',currency:c,maximumFractionDigits:2}).format(Number(n||0));
const num=(n,d=2)=>new Intl.NumberFormat('en-EG',{maximumFractionDigits:d}).format(Number(n||0));
const pct=n=>n==null?'—':new Intl.NumberFormat('en-EG',{style:'percent',maximumFractionDigits:1}).format(Number(n));
const confidenceLabel=v=>{if(v==null||v==='')return '—';const n=Number(v);return Number.isFinite(n)?num(n*100,0)+'%':String(v).toLowerCase().replace(/^./,c=>c.toUpperCase())};
const dt=v=>v?new Intl.DateTimeFormat('en-EG',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';
function saveSession(s){state.session=s;if(s)localStorage.setItem(STORE,JSON.stringify(s));else localStorage.removeItem(STORE)}
function loadSession(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch{return null}}
function toast(t){document.getElementById('toastRoot').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('toastRoot').innerHTML='',3200)}
async function authFetch(path,opts={}){const headers={apikey:KEY,'Content-Type':'application/json',...(opts.headers||{})};if(state.session?.access_token)headers.Authorization='Bearer '+state.session.access_token;let r=await fetch(PROJECT_URL+path,{...opts,headers});if(r.status===401&&state.session?.refresh_token){if(await refreshSession()){headers.Authorization='Bearer '+state.session.access_token;r=await fetch(PROJECT_URL+path,{...opts,headers})}}return r}
async function refreshSession(){try{const r=await fetch(PROJECT_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:state.session.refresh_token})});if(!r.ok)throw 0;const j=await r.json();saveSession(j);return true}catch{saveSession(null);state.user=null;render();return false}}
async function getUser(){if(!state.session?.access_token)return null;const r=await authFetch('/auth/v1/user');if(!r.ok)return null;return r.json()}
async function api(name,body,idem){const headers={};if(idem)headers['idempotency-key']=idem;const r=await authFetch('/functions/v1/'+name,{method:'POST',headers,body:JSON.stringify(body||{})});let j={};try{j=await r.json()}catch{}if(!r.ok||j.ok===false){const e=new Error(j.error||('Request failed ('+r.status+')'));e.payload=j;e.status=r.status;throw e}return j}
function friendlyError(e){const c=e?.payload?.error||e?.message||'UNKNOWN';const m={RATE_LIMITED:'Too many requests. Please try again shortly.',INVALID_USER_SESSION:'Your session expired. Please sign in again.',INTERNAL_ERROR:'The service could not complete the request.',RECOMMENDATION_STALE:'This recommendation is no longer current.',ACCEPT_REQUIRED:'Accept the recommendation before recording an external trade.',DECISION_LOCKED_AFTER_EXECUTION:'The decision is locked because an execution has already been recorded.',EXECUTION_NOT_ALLOWED:'This execution cannot be recorded under the approved recommendation sizing.',IDEMPOTENCY_CONFLICT:'This request key was already used for different data.'};return m[c]||String(c).replaceAll('_',' ').toLowerCase().replace(/^./,x=>x.toUpperCase())}
function setView(v){state.view=v;const u=new URL(location.href);u.searchParams.set('view',v);history.replaceState({},'',u);renderApp();if(v==='history')loadHistory().then(renderApp)}
function icon(n){return {dashboard:'◫',portfolio:'◒',history:'↗',recommendations:'✦',analytics:'▥',instruments:'⌕',settings:'⚙'}[n]||'•'}
const NAV=[['dashboard','Overview'],['portfolio','Portfolio'],['history','Transactions'],['recommendations','Research'],['analytics','Analytics'],['instruments','Instruments'],['settings','Settings']];
function nav(){return NAV.map(([v,l])=>'<button class="navbtn '+(state.view===v?'active':'')+'" aria-current="'+(state.view===v?'page':'false')+'" onclick="setView(\''+v+'\')"><span>'+icon(v)+'</span>'+l+'</button>').join('')}
function mobileNav(){return '<div class="mobileNav" aria-label="Mobile navigation">'+NAV.map(([v,l])=>'<button class="'+(state.view===v?'active':'')+'" onclick="setView(\''+v+'\')">'+icon(v)+'<br>'+l+'</button>').join('')+'</div>'}
function portfolioSelect(){if(!state.portfolios.length)return '';return '<select aria-label="Select portfolio" class="input select" onchange="selectPortfolio(this.value)">'+state.portfolios.map(p=>'<option value="'+esc(p.portfolio_id)+'" '+(p.portfolio_id===state.selectedPortfolioId?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>'}
function currentPortfolio(){return state.portfolios.find(x=>x.portfolio_id===state.selectedPortfolioId)||state.portfolios[0]||null}
function researchCopy(a){if(a?.ready)return {title:'Research is active',text:'The current research cycle is complete and eligible recommendations can appear.',cls:'ok'};return {title:'Research cycle in progress',text:'Recommendations will appear when the current research cycle is complete.',cls:'wait'}}
function shell(content){return '<div class="shell"><header class="top"><div class="brand"><div class="mark">EGX</div><span>Investment OS</span></div><div class="topRight"><span class="pill">Research · no broker execution</span><button class="btn secondary" style="background:transparent;color:#fff;border-color:#49645c" onclick="logout()">Sign out</button></div></header><div class="layout"><aside aria-label="Primary navigation">'+nav()+'<div class="navfoot small muted">Research and decision support for EGX portfolios.<br><br>Trades are executed outside this application and may only be recorded here afterward.</div></aside><main id="main" tabindex="-1">'+content+'</main></div>'+mobileNav()+'</div>'}
function renderDashboard(){const p=currentPortfolio(),s=p?.snapshot||{},a=p?.recommendation_activation||{},cash=s.cash?.balance||0,equity=s.equity_market_value||0,total=s.estimated_total_value||0,rc=researchCopy(a),positions=s.positions||[];let pos=positions.length?'<div class="tableWrap"><table><thead><tr><th>Security</th><th>Qty</th><th>Last</th><th>Market value</th></tr></thead><tbody>'+positions.slice(0,6).map(x=>'<tr><td><span class="ticker">'+esc(x.ticker)+'</span><div class="small muted">'+esc(x.sector||'—')+'</div></td><td class="mono">'+num(x.position?.adjusted_net_quantity??x.position?.raw_net_quantity,0)+'</td><td class="mono">'+money(x.latest_close)+'</td><td class="mono"><b>'+money(x.market_value)+'</b></td></tr>').join('')+'</tbody></table></div>':'<div class="empty"><div class="big">◎</div><b>No holdings yet</b><div>Your portfolio currently consists of cash.</div></div>';return shell('<div class="pagehead"><div><h1>'+esc(p?.name||'Portfolio overview')+'</h1><p>Current portfolio state, research readiness, and recorded activity.</p></div><div class="headActions">'+portfolioSelect()+'</div></div><div class="grid metrics"><div class="card metric"><label>Estimated value</label><strong class="mono">'+money(total,p?.base_currency)+'</strong><div class="sub">Cash + marked holdings</div></div><div class="card metric"><label>Cash</label><strong class="mono">'+money(cash,p?.base_currency)+'</strong><div class="sub">'+pct(total?cash/total:null)+' of portfolio</div></div><div class="card metric"><label>Holdings</label><strong class="mono">'+money(equity,p?.base_currency)+'</strong><div class="sub">'+positions.length+' positions</div></div><div class="card metric"><label>Transactions</label><strong>'+Number(p?.transaction_count||0)+'</strong><div class="sub">Recorded portfolio events</div></div></div><div class="grid cols"><div class="card"><div class="sectionTitle"><h2>Holdings</h2><button class="linkbtn" onclick="setView(\'portfolio\')">Manage portfolio</button></div>'+pos+'</div><div class="grid"><div class="card"><div class="sectionTitle"><h2>Research status</h2><span class="status '+rc.cls+'">'+(a?.ready?'Ready':'In progress')+'</span></div><div class="banner '+(!a?.ready?'warning':'')+'"><div class="icon">'+(a?.ready?'✓':'◷')+'</div><div><strong>'+rc.title+'</strong><div class="muted small">'+rc.text+'</div></div></div></div><div class="card"><div class="sectionTitle"><h2>Execution model</h2></div><div class="banner"><div class="icon">↗</div><div><strong>Manual execution tracking only</strong><div class="muted small">Accepting a recommendation does not place an order. Record a trade only after you execute it with your broker.</div></div></div></div></div></div><div class="disclosure">Portfolio values are estimates based on the latest ready market data. EGX Investment OS provides research and workflow support, not brokerage execution.</div>')}
function renderPortfolio(){const p=currentPortfolio(),s=p?.snapshot||{},positions=s.positions||[],sectors=s.sector_exposure||[];let table=positions.length?'<div class="tableWrap"><table><thead><tr><th>Ticker</th><th>Sector</th><th>Quantity</th><th>Latest price</th><th>Market value</th></tr></thead><tbody>'+positions.map(x=>'<tr><td class="ticker">'+esc(x.ticker)+'</td><td>'+esc(x.sector||'—')+'</td><td class="mono">'+num(x.position?.adjusted_net_quantity??x.position?.raw_net_quantity,0)+'</td><td class="mono">'+money(x.latest_close)+'</td><td class="mono"><b>'+money(x.market_value)+'</b></td></tr>').join('')+'</tbody></table></div>':'<div class="empty"><div class="big">◎</div><b>No equity positions</b><div>There are no current holdings in this portfolio.</div></div>';let sec=sectors.length?sectors.map(x=>'<div class="listrow"><div><b>'+esc(x.sector)+'</b><div class="bar" style="width:180px"><i style="width:'+Math.min(100,Number(x.equity_weight||0)*100)+'%"></i></div></div><div><b>'+money(x.market_value)+'</b><div class="small muted">'+pct(x.equity_weight)+'</div></div></div>').join(''):'<div class="empty">Sector exposure will appear when holdings exist.</div>';return shell('<div class="pagehead"><div><h1>Portfolio</h1><p>Manage portfolio identity, switch accounts, and review current exposure.</p></div><div class="headActions">'+portfolioSelect()+'<button class="btn secondary" onclick="openRenamePortfolio()">Rename</button><button class="btn" onclick="startAddPortfolio()">+ Add portfolio</button></div></div><div class="grid cols"><div class="card"><div class="sectionTitle"><h2>Positions</h2><span class="status '+(s.state==='READY'?'ok':'wait')+'">'+esc(s.state||'Ready')+'</span></div>'+table+'</div><div class="grid"><div class="card"><div class="sectionTitle"><h2>Allocation</h2></div><div class="listrow"><span>Cash</span><b>'+money(s.cash?.balance)+'</b></div><div class="listrow"><span>Equities</span><b>'+money(s.equity_market_value)+'</b></div><div class="listrow"><span>Estimated total</span><b>'+money(s.estimated_total_value)+'</b></div></div><div class="card"><div class="sectionTitle"><h2>Sector exposure</h2></div>'+sec+'</div><div class="card"><div class="sectionTitle"><h2>Recorded activity</h2></div><div class="listrow"><span>Transactions</span><b>'+num(p?.transaction_count||0,0)+'</b></div><div class="listrow"><span>Recommendations</span><b>'+num(p?.recommendation_count||0,0)+'</b></div><button class="btn secondary" style="width:100%;margin-top:12px" onclick="setView(\'history\')">View transaction history</button></div></div></div>')}
function recStatus(r){const s=r.lifecycle_state||'';if(s==='AWAITING_USER_DECISION')return ['Awaiting decision','wait'];if(s.includes('EXECUTION_COMPLETE'))return ['Execution complete','ok'];if(s.includes('EXECUTION_RECORDED'))return ['Execution recorded','ok'];if(s.includes('ACCEPTED'))return ['Accepted','ok'];if(s.includes('REJECTED'))return ['Rejected','bad'];if(s.includes('DEFERRED'))return ['Deferred','neutral'];if(s.includes('STALE'))return ['Stale','neutral'];return [s.replaceAll('_',' ').toLowerCase(),'neutral']}
function renderRecommendations(){const p=currentPortfolio(),a=p?.recommendation_activation||{},rc=researchCopy(a);let body;if(!state.recs.length)body='<div class="card"><div class="empty"><div class="big">✦</div><h2 style="color:var(--ink);margin:5px">'+rc.title+'</h2><div style="max-width:520px;margin:auto">'+rc.text+' No placeholder investment recommendations are shown in the live data path.</div></div></div>';else body=state.recs.map(r=>{const st=recStatus(r);return '<div class="recCard"><div class="recTop"><div><span class="ticker">'+esc(r.ticker)+'</span> · '+esc(r.instrument_name)+'<div class="recMeta"><span class="status neutral">'+esc(r.action)+'</span><span class="status '+st[1]+'">'+esc(st[0])+'</span><span class="status neutral">Confidence '+esc(confidenceLabel(r.confidence))+'</span></div></div><button class="btn secondary" onclick="openRecommendation(\''+esc(r.recommendation_id)+'\')">Review details</button></div><p>'+esc(r.rationale||'Research rationale available in recommendation details.')+'</p><div class="small muted">Issued '+dt(r.recommendation_created_at)+' · '+esc(r.evidence_state||'Evidence state unavailable')+'</div></div>'}).join('');return shell('<div class="pagehead"><div><h1>Research & recommendations</h1><p>Current and historical recommendation lifecycle with decision and execution audit details.</p></div><span class="status '+rc.cls+'">'+(a?.ready?'Research active':'Research in progress')+'</span></div>'+body+'<div class="disclosure">Recommendations are research outputs, not broker orders. Decisions are recorded separately from trades you execute externally.</div>')}
function renderInstruments(){let body=state.instruments.length?'<div class="card"><div class="tableWrap"><table><thead><tr><th>Ticker</th><th>Name</th><th>Sector</th><th>Last ready session</th><th>Last close</th></tr></thead><tbody>'+state.instruments.map(i=>'<tr><td class="ticker">'+esc(i.ticker)+'</td><td>'+esc(i.name)+'</td><td>'+esc(i.sector||'—')+'</td><td>'+esc(i.latest_ready_session_date||'—')+'</td><td class="mono">'+(i.latest_ready_close==null?'—':money(i.latest_ready_close,i.currency||'EGP'))+'</td></tr>').join('')+'</tbody></table></div></div>':'<div class="card empty">Reference data is unavailable right now.</div>';return shell('<div class="pagehead"><div><h1>EGX instruments</h1><p>Reference instruments and latest ready closing prices available to the application.</p></div></div>'+body)}
function instrumentMap(){return Object.fromEntries(state.instruments.map(i=>[i.instrument_id||i.id,i]))}
function renderHistory(){const p=currentPortfolio(),im=instrumentMap();let tx=state.transactions.filter(x=>!p||x.portfolio_id===p.portfolio_id);if(state.historyFilter!=='all')tx=tx.filter(x=>state.historyFilter==='trades'?['BUY','SELL'].includes(x.transaction_type):!['BUY','SELL'].includes(x.transaction_type));let rows=tx.length?tx.map(x=>{const ins=im[x.instrument_id]||{};const hasTradeNotional=['BUY','SELL','OPENING_POSITION'].includes(x.transaction_type)&&x.quantity!=null&&x.price!=null;const amount=hasTradeNotional?Number(x.quantity)*Number(x.price):(x.cash_amount==null?null:Number(x.cash_amount));return '<tr><td>'+dt(x.executed_at)+'</td><td><span class="status '+(['BUY','DEPOSIT','DIVIDEND'].includes(x.transaction_type)?'ok':x.transaction_type==='SELL'?'info':'neutral')+'">'+esc(x.transaction_type)+'</span></td><td class="ticker">'+esc(ins.ticker||'—')+'</td><td class="mono">'+(x.quantity==null?'—':num(x.quantity,0))+'</td><td class="mono">'+(x.price==null?'—':money(x.price))+'</td><td class="mono">'+(amount==null?'—':money(amount))+'</td><td>'+esc(x.note||'—')+'</td></tr>'}).join(''):'<tr><td colspan="7"><div class="empty"><div class="big">↗</div><b>No recorded transactions</b><div>Transactions appear only after onboarding balances or externally executed trades are recorded.</div></div></td></tr>';let ex=state.executions.filter(x=>!p||x.portfolio_id===p.portfolio_id);let execCard=ex.length?'<div class="card"><div class="sectionTitle"><h2>External execution records</h2><span class="status neutral">Records only</span></div><div class="tableWrap"><table><thead><tr><th>Executed</th><th>Side</th><th>Security</th><th>Qty</th><th>Price</th><th>Fees</th><th>Broker</th></tr></thead><tbody>'+ex.map(x=>{const ins=im[x.instrument_id]||{};return '<tr><td>'+dt(x.executed_at)+'</td><td>'+esc(x.side)+'</td><td class="ticker">'+esc(ins.ticker||'—')+'</td><td>'+num(x.quantity,0)+'</td><td>'+money(x.price)+'</td><td>'+money(x.fees)+'</td><td>'+esc(x.broker)+'</td></tr>'}).join('')+'</tbody></table></div></div>':'<div class="card"><div class="empty">No external execution records for this portfolio.</div></div>';return shell('<div class="pagehead"><div><h1>Execution & transaction history</h1><p>Audit trail of portfolio transactions and trades already executed outside EGX Investment OS.</p></div>'+portfolioSelect()+'</div><div class="banner warning" style="margin-bottom:16px"><div class="icon">!</div><div><strong>History does not represent broker order placement.</strong><div class="small muted">Trade rows are records of transactions executed externally. Recommendation acceptance remains separate from execution.</div></div></div><div class="card" style="margin-bottom:16px"><div class="toolbar"><button class="btn '+(state.historyFilter==='all'?'':'secondary')+'" onclick="state.historyFilter=\'all\';renderApp()">All</button><button class="btn '+(state.historyFilter==='trades'?'':'secondary')+'" onclick="state.historyFilter=\'trades\';renderApp()">Trades</button><button class="btn '+(state.historyFilter==='cash'?'':'secondary')+'" onclick="state.historyFilter=\'cash\';renderApp()">Cash & adjustments</button></div><div class="tableWrap"><table><thead><tr><th>Date</th><th>Type</th><th>Security</th><th>Qty</th><th>Price</th><th>Amount/notional</th><th>Note</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'+execCard)}
function renderAnalytics(){const p=currentPortfolio(),s=p?.snapshot||{},positions=s.positions||[],sectors=s.sector_exposure||[],total=Number(s.estimated_total_value||0),cash=Number(s.cash?.balance||0),equity=Number(s.equity_market_value||0),cashW=total?cash/total:0,largest=positions.slice().sort((a,b)=>Number(b.market_value||0)-Number(a.market_value||0))[0],topSector=sectors.slice().sort((a,b)=>Number(b.market_value||0)-Number(a.market_value||0))[0];const sec=sectors.length?sectors.map(x=>'<div class="listrow"><div style="min-width:180px"><b>'+esc(x.sector)+'</b><div class="bar"><i style="width:'+Math.min(100,Number(x.equity_weight||0)*100)+'%"></i></div></div><div><b>'+pct(x.equity_weight)+'</b><div class="small muted">'+money(x.market_value)+'</div></div></div>').join(''):'<div class="empty">No sector exposure yet.</div>';return shell('<div class="pagehead"><div><h1>Portfolio analytics</h1><p>Current allocation and concentration diagnostics from recorded portfolio state.</p></div>'+portfolioSelect()+'</div><div class="grid metrics"><div class="card metric"><label>Total value</label><strong>'+money(total)+'</strong><div class="sub">Latest portfolio estimate</div></div><div class="card metric"><label>Cash weight</label><strong>'+pct(cashW)+'</strong><div class="sub">Liquidity allocation</div></div><div class="card metric"><label>Largest holding</label><strong>'+esc(largest?.ticker||'—')+'</strong><div class="sub">'+(largest?money(largest.market_value):'No equity positions')+'</div></div><div class="card metric"><label>Largest sector</label><strong>'+esc(topSector?.sector||'—')+'</strong><div class="sub">'+(topSector?pct(topSector.equity_weight):'No sector exposure')+'</div></div></div><div class="grid two"><div class="card"><div class="sectionTitle"><h2>Cash vs equities</h2></div><div class="donut" style="--v:'+Math.max(0,Math.min(360,(total?equity/total:0)*360))+'deg" role="img" aria-label="Equity weight '+pct(total?equity/total:0)+'"></div><div class="legend"><div class="legendRow"><span class="dot"></span><span>Equities</span><b>'+pct(total?equity/total:0)+'</b></div><div class="legendRow"><span class="dot cash"></span><span>Cash</span><b>'+pct(cashW)+'</b></div></div></div><div class="card"><div class="sectionTitle"><h2>Sector concentration</h2></div>'+sec+'</div></div><div class="disclosure">Analytics are based on recorded holdings and the latest ready market prices. They do not include unrecorded broker activity and are not a performance guarantee.</div>')}

'wait')+'">'+esc(p?.snapshot?.state||'Unknown')+'</span></div><div class="listrow"><span>Research readiness</span><span class="status '+(p?.recommendation_activation?.ready?'ok':'wait')+'">'+(p?.recommendation_activation?.ready?'Ready':'In progress')+'</span></div><div class="notice">When upstream market or research jobs are still processing, the UI shows the current operational state instead of fabricating recommendations or prices.</div></div></div>')}

function renderApp(){if(!state.user)return renderAuth();if(state.workspaceError&&!state.hasLoadedWorkspace)return renderWorkspaceError();if(state.addingPortfolio||(state.hasLoadedWorkspace&&!state.portfolios.length))return renderOnboarding();if(!state.hasLoadedWorkspace){document.getElementById('app').innerHTML='<div class="authPane"><div class="skeleton" style="width:220px;height:28px"></div></div>';return}const pages={dashboard:renderDashboard,portfolio:renderPortfolio,history:renderHistory,recommendations:renderRecommendations,analytics:renderAnalytics,instruments:renderInstruments,settings:renderSettings};document.getElementById('app').innerHTML=(pages[state.view]||renderDashboard)()}
function renderAuth(mode='login'){document.getElementById('app').innerHTML='<div class="authwrap"><div class="authHero"><div class="brand"><div class="mark">EGX</div><span>Investment OS</span></div><div><div class="pill" style="display:inline-block">Research · Portfolio · Decisions</div><h1>Investment research built around your EGX portfolio.</h1><p>Track your portfolio, review current research recommendations, record your decisions, and log trades that you execute externally.</p></div><div class="small" style="color:#a9c4ba">No broker orders are placed by this application.</div></div><div class="authPane"><div class="authCard"><h2 id="authTitle">Welcome back</h2><p class="muted" id="authSub">Sign in to your investment workspace.</p><div id="loginFields"><div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="email"></div><div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">Sign in</button><div style="text-align:center;margin-top:16px"><button class="linkbtn" onclick="showRecoveryRequest()">Forgot password?</button></div></div><div id="recoverFields" class="hidden"><div class="field"><label for="recoverEmail">Email</label><input class="input" id="recoverEmail" type="email" autocomplete="email"></div><button class="btn" onclick="sendRecovery()">Send recovery email</button><div style="text-align:center;margin-top:16px"><button class="linkbtn" onclick="renderAuth()">Back to sign in</button></div></div><div id="newPasswordFields" class="hidden"><div class="field"><label for="newPassword">New password</label><input class="input" id="newPassword" type="password" minlength="8" autocomplete="new-password"></div><div class="field"><label for="newPassword2">Confirm password</label><input class="input" id="newPassword2" type="password" minlength="8" autocomplete="new-password"></div><button class="btn" onclick="setNewPassword()">Set new password</button></div><div id="authMsg" class="msg" aria-live="polite"></div></div></div></div>';if(mode==='recovery'){showNewPassword()}}
function authMsg(t,ok=false){const e=$('#authMsg');if(e){e.className='msg '+(ok?'ok':'err');e.textContent=t}}
function showRecoveryRequest(){$('#authTitle').textContent='Reset password';$('#authSub').textContent='We will send a secure recovery link to your email.';$('#loginFields').classList.add('hidden');$('#recoverFields').classList.remove('hidden')}
function showNewPassword(){$('#authTitle').textContent='Choose a new password';$('#authSub').textContent='Your recovery link is valid. Set a new password below.';$('#loginFields').classList.add('hidden');$('#recoverFields').classList.add('hidden');$('#newPasswordFields').classList.remove('hidden')}
async function login(){authMsg('');try{const r=await fetch(PROJECT_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value.trim(),password:$('#password').value})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Sign in failed');saveSession(j);state.user=await getUser();if(!state.user)throw new Error('Could not verify session');await loadData()}catch(e){authMsg(e.message||'Sign in failed')}}
async function logout(){try{if(state.session?.access_token)await authFetch('/auth/v1/logout',{method:'POST'})}catch{}saveSession(null);Object.assign(state,{user:null,portfolios:[],selectedPortfolioId:null,recs:[],instruments:[],transactions:[],executions:[],workspaceError:null,hasLoadedWorkspace:false});render()}
async function sendRecovery(){try{const email=$('#recoverEmail').value.trim();if(!email)throw new Error('Enter your email address.');const r=await fetch(PROJECT_URL+'/auth/v1/recover?redirect_to='+encodeURIComponent(APP_URL),{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email})});if(!r.ok){const j=await r.json();throw new Error(j.msg||'Could not send recovery email')}authMsg('Recovery email sent. Open the newest email to continue.',true)}catch(e){authMsg(e.message)}}
async function setNewPassword(){try{const a=$('#newPassword').value,b=$('#newPassword2').value;if(a.length<8)throw new Error('Use at least 8 characters.');if(a!==b)throw new Error('Passwords do not match.');const r=await authFetch('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:a})});if(!r.ok){const j=await r.json();throw new Error(j.msg||'Password update failed')}authMsg('Password updated. Loading your workspace…',true);state.user=await getUser();await loadData()}catch(e){authMsg(e.message)}}
async function updatePasswordFromSettings(){try{const a=$('#settingsPassword').value;if(a.length<8)throw new Error('Use at least 8 characters.');const r=await authFetch('/auth/v1/user',{method:'PUT',body:JSON.stringify({password:a})});if(!r.ok)throw new Error('Password update failed.');$('#settingsPassword').value='';toast('Password updated.')}catch(e){toast(e.message)}}
function renderOnboarding(){const rows=state.onboardingHoldings.map((h,i)=>'<div class="holdingRow"><div><label class="small">Ticker</label><input class="input" value="'+esc(h.ticker)+'" oninput="updateHolding('+i+',\'ticker\',this.value)" placeholder="COMI"></div><div><label class="small">Quantity</label><input class="input" type="number" min="1" step="1" value="'+esc(h.quantity)+'" oninput="updateHolding('+i+',\'quantity\',this.value)"></div><div><label class="small">Cost / share <span class="muted">optional</span></label><input class="input" type="number" min="0" step="0.01" value="'+esc(h.cost_basis_per_share||'')+'" oninput="updateHolding('+i+',\'cost_basis_per_share\',this.value)"></div><button class="btn secondary rm" aria-label="Remove holding" onclick="removeHolding('+i+')">×</button></div>').join('');const pr=state.onboardingPreview;let preview='';if(pr){preview='<div class="card" style="margin-top:16px"><div class="sectionTitle"><h2>Preview</h2><span class="status '+(pr.valid?'ok':'bad')+'">'+(pr.valid?'Ready to create':'Review required')+'</span></div><div class="previewGrid"><div class="previewItem"><span>Cash</span><strong>'+money(pr.cash)+'</strong></div><div class="previewItem"><span>Holdings value</span><strong>'+money(pr.market_value)+'</strong></div><div class="previewItem"><span>Estimated total</span><strong>'+money(pr.total_portfolio_value)+'</strong></div></div>'+renderPreviewNotices(pr)+'<div class="actionRow"><button class="btn" '+(!pr.valid?'disabled':'')+' onclick="commitOnboarding()">Create portfolio</button><button class="btn secondary" onclick="state.onboardingPreview=null;renderOnboarding()">Edit details</button></div></div>'}document.getElementById('app').innerHTML=shell('<div class="onboarding"><div class="pagehead"><div><h1>'+(state.addingPortfolio?'Add another portfolio':'Set up your portfolio')+'</h1><p>Enter a point-in-time opening balance. This does not recreate historical trades.</p></div>'+(state.addingPortfolio?'<button class="btn secondary" onclick="cancelAddPortfolio()">Cancel</button>':'')+'</div><div class="step"><span class="on"></span><span class="'+(pr?'on':'')+'"></span></div><div class="card"><div class="formGrid"><div class="field"><label>Portfolio name</label><input class="input" id="onName" value="'+esc(state.onboardingName)+'" oninput="state.onboardingName=this.value"></div><div class="field"><label>Opening cash (EGP)</label><input class="input" id="onCash" type="number" min="0" step="0.01" value="'+esc(state.onboardingCash)+'" oninput="state.onboardingCash=this.value"></div></div><div class="sectionTitle" style="margin-top:15px"><h2>Opening holdings</h2><button class="btn secondary" onclick="addHolding()">+ Add holding</button></div>'+rows+'<div class="banner"><div class="icon">i</div><div><strong>Point-in-time onboarding</strong><div class="small muted">Opening positions are recorded as opening balances, not historical broker trades. You can preview validation and exposure before creating the portfolio.</div></div></div><div class="actionRow"><button class="btn" onclick="previewOnboarding()">Preview portfolio</button></div></div>'+preview+'</div>')}
function startAddPortfolio(){state.addingPortfolio=true;state.onboardingPreview=null;state.onboardingHoldings=[];state.onboardingName='My EGX Portfolio';state.onboardingCash='0';renderApp()}

function updateHolding(i,k,v){state.onboardingHoldings[i][k]=v}function addHolding(){state.onboardingHoldings.push({ticker:'',quantity:'',cost_basis_per_share:''});renderOnboarding()}function removeHolding(i){state.onboardingHoldings.splice(i,1);renderOnboarding()}
function onboardingPayload(){return {base_currency:'EGP',cash:Number(state.onboardingCash||0),holdings:state.onboardingHoldings.filter(h=>String(h.ticker).trim()).map(h=>({ticker:String(h.ticker).toUpperCase().trim(),quantity:Number(h.quantity),...(h.cost_basis_per_share?{cost_basis_per_share:Number(h.cost_basis_per_share)}:{})}))}}
function noticeLabel(x){const m={CURRENT_SINGLE_STOCK_EXPOSURE_ABOVE_15PCT:'Single-stock exposure is above 15%.',CURRENT_SECTOR_EXPOSURE_ABOVE_30PCT:'Sector exposure is above 30%.',CURRENT_CASH_RESERVE_BELOW_10PCT:'Cash reserve is below 10%.',CASH_MUST_BE_NONNEGATIVE_NUMBER:'Cash must be a non-negative number.',TOTAL_PORTFOLIO_VALUE_MUST_BE_POSITIVE:'Portfolio value must be positive.',HOLDINGS_ARRAY_REQUIRED:'Holdings data is required.'};return m[x]||String(x).replaceAll('_',' ').toLowerCase().replace(/^./,z=>z.toUpperCase())}
function renderPreviewNotices(pr){const all=[...(pr.errors||[]).map(x=>['bad',x]),...(pr.warnings||[]).map(x=>['wait',x])];return all.length?'<div class="list">'+all.map(([c,x])=>'<div class="banner '+(c==='wait'?'warning':'')+'"><div class="icon">'+(c==='bad'?'!':'△')+'</div><div>'+esc(noticeLabel(x))+'</div></div>').join('')+'</div>':'<div class="banner"><div class="icon">✓</div><div>Validation passed with no portfolio warnings.</div></div>'}
async function previewOnboarding(){try{state.onboardingPreview=(await api('portfolio-onboarding-api',{action:'preview',payload:onboardingPayload()})).preview;renderOnboarding()}catch(e){toast(friendlyError(e))}}
async function commitOnboarding(){try{const name=state.onboardingName.trim()||'My EGX Portfolio',idem='onboarding-'+crypto.randomUUID();const res=await api('portfolio-onboarding-api',{action:'commit',name,payload:onboardingPayload()},idem);toast('Portfolio created.');state.onboardingPreview=null;state.addingPortfolio=false;await loadData();const id=res?.result?.portfolio_id||res?.result?.id;if(id&&state.portfolios.some(p=>p.portfolio_id===id))state.selectedPortfolioId=id;renderApp()}catch(e){toast(friendlyError(e))}}
function openRenamePortfolio(){const p=currentPortfolio();if(!p)return;document.getElementById('modalRoot').innerHTML='<div class="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="renameTitle"><div class="modalHead"><h2 id="renameTitle">Rename portfolio</h2><button class="x" aria-label="Close" onclick="closeModal()">×</button></div><div class="field"><label for="portfolioName">Portfolio name</label><input class="input" id="portfolioName" maxlength="120" value="'+esc(p.name)+'"></div><div class="actionRow"><button class="btn" onclick="renamePortfolio()">Save name</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div></div></div>'}
async function renamePortfolio(){try{const p=currentPortfolio(),name=$('#portfolioName').value.trim();if(!name||name.length>120)throw new Error('Use a portfolio name between 1 and 120 characters.');const r=await authFetch('/rest/v1/portfolios?id=eq.'+encodeURIComponent(p.portfolio_id),{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({name})});if(!r.ok)throw new Error('Could not rename portfolio.');closeModal();toast('Portfolio renamed.');await loadData()}catch(e){toast(e.message)}}
function openRecommendation(id){const r=state.recs.find(x=>x.recommendation_id===id);if(!r)return;const st=recStatus(r),exec=r.execution||{},latest=r.latest_decision,fresh=r.freshness||{};document.getElementById('modalRoot').innerHTML='<div class="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="recTitle"><div class="modalHead"><div><div id="recTitle" class="ticker" style="font-size:20px">'+esc(r.ticker)+' · '+esc(r.instrument_name)+'</div><div class="recMeta"><span class="status neutral">'+esc(r.action)+'</span><span class="status '+st[1]+'">'+esc(st[0])+'</span></div></div><button class="x" aria-label="Close" onclick="closeModal()">×</button></div><h3>Research rationale</h3><p class="muted" style="line-height:1.6">'+esc(r.rationale||'No rationale text available.')+'</p><div class="previewGrid"><div class="previewItem"><span>Strength</span><strong>'+esc(r.strength??'—')+'</strong></div><div class="previewItem"><span>Confidence</span><strong>'+esc(confidenceLabel(r.confidence))+'</strong></div><div class="previewItem"><span>Approved quantity</span><strong>'+esc(r.approved_quantity??'—')+'</strong></div></div><h3>Audit trail</h3><div class="audit"><div class="auditRow"><b>Recommendation issued</b><span>'+dt(r.recommendation_created_at)+'</span></div><div class="auditRow"><b>Evidence state</b><span>'+esc(r.evidence_state||'—')+'</span></div><div class="auditRow"><b>Thesis state</b><span>'+esc(r.thesis_state||'—')+'</span></div><div class="auditRow"><b>Risk state</b><span>'+esc(r.risk_state||'—')+'</span></div><div class="auditRow"><b>Freshness</b><span>'+esc(fresh.state||'—')+'</span></div><div class="auditRow"><b>Latest decision</b><span>'+(latest?esc(latest.decision)+' · '+dt(latest.created_at)+(latest.reason?' · '+esc(latest.reason):''):'No decision recorded')+'</span></div><div class="auditRow"><b>External executions</b><span>'+num(exec.count||0,0)+' record(s) · '+num(exec.executed_quantity||0,0)+' shares · '+money(exec.executed_notional||0)+'</span></div></div><h3>Your decision</h3><div class="field"><label>Optional note</label><textarea class="input" id="decisionReason" maxlength="1000" placeholder="Reason or note for your records"></textarea></div><div class="actionRow"><button class="btn" '+(!r.can_decide?'disabled':'')+' onclick="decide(\''+esc(id)+'\',\'ACCEPT\')">Accept</button><button class="btn secondary" '+(!r.can_decide?'disabled':'')+' onclick="decide(\''+esc(id)+'\',\'DEFER\')">Defer</button><button class="btn danger" '+(!r.can_decide?'disabled':'')+' onclick="decide(\''+esc(id)+'\',\'REJECT\')">Reject</button></div><h3 style="margin-top:24px">External trade record</h3><div class="banner"><div class="icon">↗</div><div><strong>No broker order is placed here.</strong><div class="small muted">Use this only after you have executed the trade externally.</div></div></div><div class="actionRow"><button class="btn secondary" '+(!r.can_record_execution?'disabled':'')+' onclick="openExecution(\''+esc(id)+'\')">Record external execution</button><button class="btn secondary" onclick="setView(\'history\');closeModal()">View history</button></div></div></div>'}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
async function decide(id,d){try{const reason=$('#decisionReason')?.value?.trim()||null;await api('recommendation-workflow-api',{action:'decide',recommendation_id:id,decision:d,reason},'decision-'+crypto.randomUUID());toast('Decision recorded. No broker order was placed.');closeModal();await loadRecommendations();renderApp()}catch(e){toast(friendlyError(e))}}
function openExecution(id){const r=state.recs.find(x=>x.recommendation_id===id);if(!r)return;const max=r.remaining_approved_quantity??r.approved_quantity;document.getElementById('modalRoot').innerHTML='<div class="modalBack"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="execTitle"><div class="modalHead"><div><h2 id="execTitle">Record external execution</h2><div class="muted small">'+esc(r.ticker)+' · '+esc(r.action)+'</div></div><button class="x" aria-label="Close" onclick="closeModal()">×</button></div><div class="banner warning" style="margin-top:14px"><div class="icon">!</div><div><strong>This does not place a trade.</strong><div class="small muted">Enter details only for a transaction you already executed with your broker.</div></div></div><div class="formGrid"><div class="field"><label>Quantity</label><input class="input" id="exQty" type="number" min="1" step="1" '+(max!=null?'max="'+esc(max)+'"':'')+'></div><div class="field"><label>Price (EGP)</label><input class="input" id="exPrice" type="number" min="0.000001" step="0.01"></div><div class="field"><label>Fees (EGP)</label><input class="input" id="exFees" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Broker</label><input class="input" id="exBroker" maxlength="100" value="Thndr"></div></div><div class="field"><label>Executed at</label><input class="input" id="exAt" type="datetime-local" value="'+new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)+'"></div>'+(max!=null?'<div class="small muted">Remaining approved quantity: '+esc(max)+'</div>':'')+'<div class="actionRow"><button class="btn" onclick="recordExecution(\''+esc(id)+'\')">Record execution</button><button class="btn secondary" onclick="openRecommendation(\''+esc(id)+'\')">Back</button></div></div></div>'}
async function recordExecution(id){try{const quantity=Number($('#exQty').value),price=Number($('#exPrice').value),fees=Number($('#exFees').value||0),broker=$('#exBroker').value.trim(),executed_at=new Date($('#exAt').value).toISOString();if(!(quantity>0)||quantity!==Math.trunc(quantity)||!(price>0))throw new Error('Quantity must be whole shares and price must be positive.');await api('recommendation-workflow-api',{action:'record_execution',recommendation_id:id,quantity,price,fees,broker,executed_at},'execution-'+crypto.randomUUID());toast('External execution recorded. No broker order was placed.');closeModal();await loadData()}catch(e){toast(e.payload?friendlyError(e):e.message)}}
async function selectPortfolio(id){state.selectedPortfolioId=id;state.recs=[];state.transactions=[];state.executions=[];renderApp();await Promise.all([loadRecommendations(),loadHistory()]);renderApp()}
async function loadRecommendations(){try{const j=await api('recommendation-workflow-api',{action:'feed'});state.recs=(j.data?.recommendations||[]).filter(r=>!state.selectedPortfolioId||r.portfolio_id===state.selectedPortfolioId)}catch(e){toast('Could not load recommendations: '+friendlyError(e))}}
async function loadHistory(){if(!state.user)return;try{const pf=state.selectedPortfolioId?'&portfolio_id=eq.'+encodeURIComponent(state.selectedPortfolioId):'';const q='?select=id,portfolio_id,instrument_id,transaction_type,executed_at,quantity,price,fees,cash_amount,external_capital,note,manual_execution_id'+pf+'&order=executed_at.desc&limit=500';const e='?select=id,recommendation_id,portfolio_id,instrument_id,executed_at,side,quantity,price,fees,broker,created_at'+pf+'&order=executed_at.desc&limit=500';const [tr,er]=await Promise.all([authFetch('/rest/v1/portfolio_transactions'+q),authFetch('/rest/v1/manual_executions'+e)]);if(!tr.ok||!er.ok)throw new Error('History API unavailable');state.transactions=await tr.json();state.executions=await er.json()}catch(e){if(state.view==='history')toast('Could not load transaction history.')}}
async function retryWorkspace(){state.workspaceError=null;document.getElementById('app').innerHTML='<div class="authPane"><div class="skeleton" style="width:220px;height:28px"></div></div>';await loadData()}
async function loadData(){const previouslyLoaded=state.hasLoadedWorkspace;state.loading=true;try{const [ps,rd]=await Promise.all([api('portfolio-state-api',{}),api('reference-data-api',{})]);state.portfolios=ps.data?.portfolios||[];if(!state.selectedPortfolioId||!state.portfolios.some(p=>p.portfolio_id===state.selectedPortfolioId))state.selectedPortfolioId=state.portfolios[0]?.portfolio_id||null;state.instruments=rd.data?.instruments||[];state.workspaceError=null;state.hasLoadedWorkspace=true;await Promise.all([loadRecommendations(),loadHistory()]);const q=new URLSearchParams(location.search).get('view');if(q&&NAV.some(([v])=>v===q))state.view=q;renderApp()}catch(e){const msg=friendlyError(e);if(previouslyLoaded){toast('Could not refresh workspace: '+msg)}else{state.workspaceError=msg;renderWorkspaceError()}}finally{state.loading=false}}
async function handleCallback(){const h=new URLSearchParams(location.hash.slice(1)),q=new URLSearchParams(location.search);const err=h.get('error_description')||q.get('error_description');if(err){renderAuth();authMsg(err);history.replaceState({},'',location.pathname);return true}const access=h.get('access_token')||q.get('access_token'),refresh=h.get('refresh_token')||q.get('refresh_token'),type=h.get('type')||q.get('type');if(access){saveSession({access_token:access,refresh_token:refresh,token_type:'bearer'});history.replaceState({},'',location.pathname+(type==='recovery'?'?recovery=1':''));state.user=await getUser();if(type==='recovery'){renderAuth('recovery');return true}}return false}
async function render(){state.session=loadSession();const cb=await handleCallback();if(cb&&new URLSearchParams(location.search).get('recovery')==='1')return;if(state.session){state.user=await getUser();if(!state.user&&state.session.refresh_token){await refreshSession();state.user=await getUser()}}if(!state.user){renderAuth();return}await loadData()}
render();
</script>
</body></html>
